<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- ▼ DATA LOGGING: paste your Google Apps Script web-app URL (ends in /exec) between the quotes. Leave it as is to play without logging. -->
<script>window.RUSH_LOG_URL='PASTE_YOUR_WEB_APP_URL_HERE';</script>
</head><body>
<title>Pipeline Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: The Pull template — charcoal top bar + hazard stripe, stage map of round nodes, level = 50:50 split (controls left, live 3D site right). */
:root{
  --y:#FFB703; --char:#264653; --dig:#E63946; --pipe:#2A9D8F; --fill:#1D6FB8;
  --bg:#F4F1E8; --card:#FFFFFF; --ink:#1B2A31; --soft:#5A6A72; --line:#E2E0D8; --cell:#FBFAF6;
  --good:#1B8A4B; --bad:#D63A2F; --amber:#E08A00; --gridline:#D6D2C6; --gridline5:#A9A393;
  --shadow:0 2px 0 rgba(0,0,0,.08), 0 8px 24px rgba(20,35,45,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181B; --card:#1B2327; --ink:#EEF1F2; --soft:#9AA7AE; --line:#2B353B; --cell:#161E22;
  --good:#5FD38D; --bad:#FF6B5E; --amber:#FFB23E; --gridline:#34414A; --gridline5:#5C6B75; --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12181B; --card:#1B2327; --ink:#EEF1F2; --soft:#9AA7AE; --line:#2B353B; --cell:#161E22;
  --good:#5FD38D; --bad:#FF6B5E; --amber:#FFB23E; --gridline:#34414A; --gridline5:#5C6B75; --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased;
  padding-left:max(0px,env(safe-area-inset-left,0px)); padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{cursor:not-allowed; opacity:.4}
:focus-visible{outline:3px solid var(--y); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px; margin:0 auto; padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.wrap.wide{max-width:1560px}

/* top bar */
.top{background:var(--char); color:#fff}
.top .wrap{display:flex; align-items:center; gap:12px; padding-block:12px}
.logo{font-weight:900; font-size:24px; letter-spacing:-.02em; background:none; border:0; color:#fff; padding:0}
.logo span{color:var(--y)}
.top .sp{flex:1}
.ibtn{background:rgba(255,255,255,.12); border:0; color:#fff; border-radius:12px; padding:8px 14px; font-weight:800}
.logo{white-space:nowrap}
@media (max-width:480px){.logo{font-size:20px}.ibtn{padding:6px 10px}.lname{font-size:18px}}
.hazard{height:6px; background:repeating-linear-gradient(-45deg,var(--y) 0 10px,var(--char) 10px 20px)}

/* big buttons */
.go{border:0; border-radius:16px; padding:12px 22px; font-weight:900; font-size:18px; background:var(--y); color:#1B2A31; box-shadow:0 4px 0 #C98F00; transition:transform .08s}
.go:active{transform:translateY(3px); box-shadow:0 1px 0 #C98F00}
.go.dark{background:var(--char); color:#fff; box-shadow:0 4px 0 #13262D}
.go.ghost{background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--line); border:1px solid var(--line)}
.row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; align-items:center}
.row.l{justify-content:flex-start}

/* map */
.stage{background:var(--card); border-radius:22px; padding:16px 18px; box-shadow:var(--shadow)}
.stage h2{margin:0 0 12px; font-size:18px; display:flex; align-items:center; gap:10px}
.stage h2 .tag{background:var(--char); color:#fff; border-radius:10px; padding:2px 10px; font-size:14px}
.path{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start}
.node{display:grid; justify-items:center; gap:6px; width:118px; background:none; border:0; padding:4px}
.node .ball{width:74px; height:74px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:20px;
  background:var(--y); color:#1B2A31; box-shadow:0 5px 0 #C98F00}
.node.done .ball{background:var(--char); color:#fff; box-shadow:0 5px 0 #13262D}
.node:disabled .ball{background:var(--line); color:var(--soft); box-shadow:none}
.node .nm{font-weight:800; font-size:14px; text-align:center}
.stars{color:var(--y); letter-spacing:2px; font-size:16px}
.stars .off{color:var(--line)}

/* level bar */
.lbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.lname{font-weight:900; font-size:22px}
.chip{border-radius:999px; padding:6px 12px; font-weight:800; font-size:14px; background:var(--card); border:2px solid var(--line)}
.chip.ok{border-color:var(--good); color:var(--good)}
.chip.no{border-color:var(--bad); color:var(--bad)}
.chip.y{border-color:var(--y)}
.hud{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto}
.stat{background:var(--card); border-radius:14px; padding:6px 14px; box-shadow:var(--shadow); font-weight:900; font-size:18px; display:flex; align-items:center; gap:8px}
.stat small{font-size:11px; color:var(--soft); font-weight:800; text-transform:uppercase; letter-spacing:.04em}
.stat.warn{color:var(--bad)} .stat.good{color:var(--good)}

/* split: controls left, live site right */
.split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:1000px){.split{grid-template-columns:1fr}}
.lcol{display:grid; gap:12px; min-width:0}
.rcol{position:sticky; top:12px; height:calc(100vh - 24px); min-width:0}
@media (max-width:1000px){.rcol{position:static; height:auto; order:-1}}
.board,.dock{background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:12px; min-width:0}
.bhd{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; font-weight:900; font-size:16px}
.bhd .sp{flex:1}
.banner{border-radius:18px; padding:12px 16px; font-weight:900; font-size:18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.banner.bad{background:color-mix(in srgb, var(--bad) 14%, var(--card)); color:var(--bad)}
.banner.good{background:color-mix(in srgb, var(--good) 16%, var(--card)); color:var(--good)}
.banner.amber{background:color-mix(in srgb, var(--amber) 16%, var(--card)); color:var(--amber)}
.banner .sp{flex:1}
.guide{background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:12px 16px; border-left:6px solid var(--char)}
.guide.why{animation:rise .3s}
.guide h4{margin:0 0 4px; font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:.06em; color:var(--soft)}
.guide p{margin:0; font-size:15px; font-weight:600; line-height:1.5; max-width:70ch}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* site card */
.sitecard{background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:12px; display:flex; flex-direction:column; gap:10px; height:100%}
.sitehd{display:flex; align-items:center; gap:10px}
.sitehd .ttl{border-radius:999px; padding:6px 14px; font-weight:900; font-size:14px; color:#fff; background:var(--char)}
.sitehd .clock{margin-left:auto; font-weight:900; font-size:20px; min-width:8ch; text-align:right; font-variant-numeric:tabular-nums}
.sitewrap{position:relative; flex:1; min-height:300px; border-radius:14px; overflow:hidden;
  background:linear-gradient(#78B8E3, #E4F2F8 92%); contain:layout}
@media (max-width:1000px){.sitewrap{flex:none; height:min(56vw,360px); min-height:220px}}
.cv{position:absolute; inset:0}
canvas.site3d{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none}
.v3hint{position:absolute; left:10px; bottom:8px; z-index:2; font-size:12px; font-weight:800; color:#1B2A31; background:rgba(255,255,255,.7); padding:3px 8px; border-radius:8px; pointer-events:none}
.no3d{position:absolute; inset:0; display:grid; place-items:center; font-weight:900; color:#1B2A31}
.clashov{position:absolute; inset:0; z-index:3; display:grid; place-content:center; justify-items:center; gap:10px; text-align:center; padding:18px;
  background:rgba(120,10,10,.55); color:#fff; animation:clashbg 1s ease-in-out infinite alternate}
.clashov .cbig{font-size:44px; font-weight:900; letter-spacing:.04em; text-shadow:0 3px 0 rgba(0,0,0,.35); animation:clashpulse .6s ease-in-out infinite alternate}
.clashov .cmsg{font-size:18px; font-weight:900; background:rgba(0,0,0,.35); padding:8px 14px; border-radius:12px}
@keyframes clashbg{from{background:rgba(120,10,10,.45)} to{background:rgba(170,20,20,.62)}}
@keyframes clashpulse{from{transform:scale(1)} to{transform:scale(1.08)}}
.crewchips{display:flex; gap:8px; flex-wrap:nowrap; overflow:hidden; min-height:34px; align-items:center}
@media (max-width:640px){.crewchips{flex-wrap:wrap}}
.cchip{border-radius:999px; padding:5px 12px; font-weight:800; font-size:14px; background:var(--card); border:2px solid var(--line); white-space:nowrap; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
button.cchip{cursor:pointer}
.cchip.work{border-color:var(--good); color:var(--good)}
.cchip.ready{border-color:var(--y)}
.cchip.focus{background:var(--char); color:#fff; border-color:var(--char)}
.cchip.done{color:var(--soft)}
.sitectl{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.sitectl input[type=range]{flex:1; min-width:120px; accent-color:var(--char)}
.spdsw{display:inline-flex; border-radius:10px; overflow:hidden; border:2px solid var(--line); flex:none}
.spdsw button{border:0; background:var(--card); padding:6px 9px; font-weight:900; font-size:13px}
.spdsw button.on{background:var(--char); color:#fff}
.play{border:0; border-radius:12px; padding:9px 14px; font-weight:900; background:var(--y); color:#1B2A31; box-shadow:0 3px 0 #C98F00; min-width:96px}

/* tray + order rows (1.1) */
.tray{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:560px){.tray{grid-template-columns:1fr}}
.tile{border:3px solid var(--tc); border-radius:18px; padding:10px; display:grid; justify-items:center; gap:2px; background:var(--cell); user-select:none; box-shadow:0 4px 0 var(--line)}
.tile.used{opacity:.25}
.tile .ico{font-size:36px; line-height:1.1}
.tile b{font-size:16px}
.tile small{font-weight:800; color:var(--soft); font-size:13px}
.slots{display:grid; gap:8px; margin-top:12px}
.slot{display:flex; align-items:center; gap:12px; border:3px dashed var(--line); border-radius:16px; min-height:58px; padding:6px 14px; font-weight:900}
.slot .n{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--line); color:var(--soft)}
.slot.filled{border-style:solid; border-color:var(--tc); background:color-mix(in srgb, var(--tc) 10%, var(--card))}
.slot.filled .n{background:var(--tc); color:#fff}
.slot .ico{font-size:24px}
.dragghost{position:fixed; z-index:40; pointer-events:none; transform:translate(-50%,-50%); color:#fff; font-weight:900; padding:8px 14px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,.25); white-space:nowrap}

/* timeline (bar chart) */
.tl{display:grid; gap:6px; overflow-x:auto}
.tl-row,.tl-axis{display:grid; grid-template-columns:130px minmax(240px,1fr) 44px; gap:8px; align-items:center}
@media (max-width:560px){.tl-row,.tl-axis{grid-template-columns:100px minmax(180px,1fr) 34px; gap:6px}}
.tl-lab{font-weight:900; font-size:14px; white-space:nowrap}
.track{position:relative; height:36px; border-radius:10px; background-color:var(--cell); border:2px solid var(--line);
  background-image:repeating-linear-gradient(to right,var(--gridline) 0 1px,transparent 1px calc(100% / var(--tmax)))}
.track.hot{border-color:var(--y); border-style:dashed}
.bar{position:absolute; top:4px; bottom:4px; border-radius:8px; color:#fff; font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center; white-space:nowrap; overflow:hidden; user-select:none}
.bar.slide{cursor:grab; touch-action:none; box-shadow:0 0 0 3px var(--y)}
.bar.locked{box-shadow:0 0 0 2px var(--good)}
.bar .fp{position:absolute; inset:0 auto 0 0; background:rgba(255,255,255,.35)}
.flag{position:absolute; top:-4px; bottom:-4px; width:3px; margin-left:-1px; background:var(--y); border-radius:2px; pointer-events:none}
.tl-axis .ax{position:relative; height:16px}
.tl-axis .ax span{position:absolute; transform:translateX(-50%); font-size:11px; font-weight:800; color:var(--soft)}
.tl-st{font-weight:900; font-size:14px; color:var(--soft)}
.tl-st.ok{color:var(--good)}

/* measure card */
.mhd{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-weight:900; font-size:16px}
.mhd .ico{font-size:26px}
.mhd small{color:var(--soft); font-weight:800}
.pb{position:relative; height:42px; border-radius:12px; background:var(--cell); border:2px solid var(--line); overflow:hidden; margin:10px 0}
.pb i{position:absolute; inset:0 auto 0 0; transition:width .12s}
.pb span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--ink)}
.pb.full{border:3px solid var(--y); cursor:grab}
.pb.full span{color:#fff}
.mrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.mrow input{flex:1; min-width:160px; accent-color:var(--char)}
.big{font-weight:900; font-size:19px}
.big b{color:var(--y)}

/* LOB chart */
.lob{width:100%; height:auto; display:block; user-select:none; touch-action:none}
.lob.pick{cursor:crosshair}
.lob .plot{fill:var(--cell)}
.lob .g1{stroke:var(--gridline); stroke-width:.6}
.lob .g2{stroke:var(--gridline5); stroke-width:.8}
.lob .ax{fill:var(--soft); font-size:10px; font-weight:800}
.lob .axt{fill:var(--soft); font-size:10px; font-weight:900; letter-spacing:.05em}
.lob .bt{fill:#fff; font-size:10px; font-weight:900}
.lob .bl{fill:var(--soft); font-size:10px; font-weight:900}
.lob .ring{fill:none; stroke:var(--y); stroke-width:3; animation:ring 1.2s infinite; transform-box:fill-box; transform-origin:center}
.lob .ringlab{fill:var(--ink); font-size:11px; font-weight:900}
.lob .hit{fill:rgba(214,58,47,.22); stroke:var(--bad); stroke-width:2.5}
.lob .hitlab{fill:var(--bad); font-size:12px; font-weight:900}
.lob .cur{stroke:var(--y); stroke-width:2}
.lob .pt{stroke:var(--card); stroke-width:1.5}
.lob .mk{fill:var(--y); stroke:var(--ink); stroke-width:1}
.lob .mklab{fill:var(--ink); font-size:11px; font-weight:900}
.lob .grab{cursor:ew-resize}
@keyframes ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.6);opacity:.2}}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; font-weight:800; color:var(--soft)}
.legend i{display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:5px}

/* compare bars */
.cmp{display:grid; gap:8px}
.crow{display:grid; grid-template-columns:110px 1fr; gap:10px; align-items:center; font-weight:900; font-size:14px}
.strack{height:28px; border-radius:8px; background:var(--bg); overflow:hidden}
.sbar{height:100%; border-radius:8px; display:flex; align-items:center; justify-content:flex-end; padding:0 10px; font-weight:900; font-size:14px; color:#fff; min-width:60px}
.ctabs{display:inline-flex; flex-wrap:wrap; gap:6px}
.ctab{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--soft); font:inherit; font-weight:900; font-size:14px; cursor:pointer}
.ctab.on{background:var(--char); color:#fff; border-color:var(--char)}
.ctab.ok{color:var(--good)}
.ctab:disabled{cursor:default; opacity:.85}
.ctab:not(:disabled):hover{border-color:var(--y)}
.ctab .undo{font-size:13px; padding:0 6px; border-radius:8px; background:rgba(255,193,7,.18); color:var(--y)}
.info{display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--soft); background:transparent; color:var(--soft);
  font:italic 900 11px/1 Georgia,"Times New Roman",serif; cursor:pointer; padding:0; margin:0 0 0 5px; vertical-align:middle; flex:none; text-transform:none; letter-spacing:0}
.info:hover,.info:focus-visible,.info[aria-expanded="true"]{background:var(--y); border-color:var(--y); color:var(--char); outline:none}
.info.static{cursor:default; margin:0 2px}
.infopop{position:fixed; z-index:400; background:var(--card); color:var(--ink); border:2px solid var(--char); border-radius:14px; box-shadow:0 12px 32px rgba(0,0,0,.28);
  padding:12px 14px; font-size:14px; line-height:1.45; font-weight:500; text-align:left; animation:popin .12s ease-out}
.infopop b{display:block; font-size:15px; font-weight:900; margin-bottom:2px}
.infopop p{margin:6px 0 0}
.infopop .why span{display:block; font-size:11px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:var(--soft)}
.infopop .ex{color:var(--soft); font-size:13px}
@keyframes popin{from{opacity:0; transform:translateY(-3px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.infopop{animation:none}}
.lob .evband{fill:rgba(255,183,3,.16); stroke:var(--y); stroke-width:1}
.lob .evlab{font-size:9px; font-weight:900; fill:var(--ink)}
.lob .waitseg{fill:none; stroke:var(--bad); stroke-width:5; opacity:.75; stroke-linecap:round; stroke-linejoin:round}
.clashov.evt{background:rgba(38,70,83,.72)}
.clashov.evt .cbig{font-size:34px; color:var(--y); animation:none}
.r2opt{font:inherit; color:inherit; text-align:left; cursor:pointer}
.r2opt:focus-visible{outline:3px solid var(--y); outline-offset:2px}
.eqslot .opts .r2opt{flex:1 1 calc(50% - 8px); min-width:150px; padding:6px 10px}
.r2key{display:inline-flex; gap:5px; align-items:center; font-size:11px; font-weight:800; color:var(--soft)}
.r2key i{display:inline-block; width:16px; height:0; border-top:2.5px solid var(--soft); margin-left:6px}
.r2key i.k1{border-top-style:dashed; opacity:.7} .r2key i.k3{opacity:.35} .r2key i.k4{border-top:4px solid var(--bad); opacity:.75}
.r2stars{color:var(--y); letter-spacing:1px; margin-left:6px} .r2stars .off{opacity:.3}
.tbl td.bad{color:var(--bad); font-weight:800} .tbl td.good{color:var(--good); font-weight:800}
.debrief{margin-top:8px; background:var(--cell); border-radius:14px; padding:10px 14px; border-left:5px solid var(--char)}
.debrief h4{margin:0 0 6px; font-size:15px}
.debrief ul{margin:0; padding:0; list-style:none; display:grid; gap:4px}
.debrief li{display:flex; gap:8px; font-size:13.5px; font-weight:600; line-height:1.4}
.debrief li span{flex:none; width:20px; text-align:center}
.debrief li.bad{color:var(--bad)} .debrief li.strong{font-weight:900; font-size:14.5px; margin-top:4px}
.borrow{margin-top:8px; padding:8px 10px; border-radius:14px; background:var(--cell); border:2px dashed var(--line)}
.borrow .opts .opt{min-width:150px}
.brates{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:8px; font-size:13.5px; font-weight:700}
.brates b{font-weight:900} .brates b.down{color:var(--bad)} .brates small{color:var(--soft); font-weight:700}
.fixbox{margin-top:8px; padding:8px 10px; border-radius:14px; background:var(--cell); border:2px dashed var(--line); display:grid; gap:6px}
.fixrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.fixrow .step output{min-width:58px; text-align:center}
.ctabs2{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.tbl.fsched tr.crewhd td{font-weight:900; padding-top:8px}
.tbl tr.seg td:first-child{padding-left:16px}
.tbl tr.seg.red td{color:var(--bad); background:color-mix(in srgb, var(--bad) 7%, transparent)}
.tbl tr.segtot td{font-weight:800; border-top:1px solid var(--line)}
.r2opt.off{opacity:.55; cursor:not-allowed}
.pills{display:inline-flex; border-radius:12px; overflow:hidden; border:2px solid var(--line)}
.pills span{padding:6px 12px; font-weight:900; font-size:14px; background:var(--card)}
.pills span.on{background:var(--char); color:#fff}
.pills span.ok{color:var(--good)}

/* overlays */
.ov{position:fixed; inset:0; background:rgba(15,25,30,.55); display:grid; place-items:center; z-index:20; padding:16px}
.pidin{width:100%; font:inherit; font-size:20px; font-weight:800; padding:10px 12px; border:2px solid var(--line,#ccc); border-radius:12px; margin:6px 0 10px; text-align:center; letter-spacing:.04em}

  function controls(){
    const el = R.domElement; let drag = null; const pts = new Map();
    el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); drag = { x:e.clientX, y:e.clientY, th:view.theta, ph:view.phi, d:view.cd || view.dist, pinch:null }; el.style.cursor = 'grabbing'; });
    el.addEventListener('pointermove', e => {
      if (!drag) return; pts.set(e.pointerId, e);
      if (pts.size === 2){ const [a, b] = [...pts.values()], dd = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (!drag.pinch) drag.pinch = dd; view.user = true; view.dist = Math.max(14, Math.min(220, drag.d * drag.pinch / dd)); return; }
      view.theta = drag.th - (e.clientX - drag.x) * 0.006;
      view.phi = Math.max(0.08, Math.min(1.35, drag.ph + (e.clientY - drag.y) * 0.005));
    });
    const up = e => { pts.delete(e.pointerId); if (!pts.size){ drag = null; el.style.cursor = ''; } };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', e => { e.preventDefault(); if (!view.user){ view.user = true; view.dist = view.cd || view.dist; } view.dist = Math.max(14, Math.min(220, view.dist * (1 + Math.sign(e.deltaY) * 0.1))); }, { passive:false });
    el.addEventListener('dblclick', () => { view.user = false; view.mode = view.mode === 'follow' ? 'whole' : 'follow'; view.theta = -0.62; view.phi = view.mode === 'whole' ? 0.55 : 0.40; fit(); });
  }

  function sync(wrap, S){
    if (!supported() || !wrap) return;
    if (!built){ try { build(); } catch (e){ ok = false; S3why = 'The 3D scene could not start (' + (e && e.message || e) + ')'; console.warn(e); if (window.__s3fail) window.__s3fail(); return; } }
    if (R.domElement.parentNode !== wrap){ wrap.appendChild(R.domElement); lastW = 0; }
    const fr = (ft, k) => Math.max(0, Math.min(1, (ft - k * 30) / 30));
    for (let s = 0; s < SEGMENTS; s++){
      const d = fr(S.ft[0], s), p = fr(S.ft[1], s), f = fr(S.ft[2], s), o = segs[s];
      const rest = SW * (1 - d);
      o.cover.visible = rest > 0.01; o.cover.scale.x = Math.max(0.01, rest); o.cover.position.x = o.xs + SW * d + rest / 2;
      o.pipe.visible = p > 0; o.pipe.scale.y = Math.max(0.01, SW * p); o.pipe.position.x = o.xs + SW * p / 2;
      const left = (SW - 0.4) * (1 - p);
      o.strung.visible = left > 0.05; o.strung.scale.y = Math.max(0.01, left); o.strung.position.x = o.xs + SW - 0.2 - left / 2;
      o.ends[0].visible = o.ends[1].visible = o.strung.visible; o.ends[0].position.x = o.xs + SW - 0.2 - left + 0.09; o.ends[1].position.x = o.xs + SW - 0.29;
      o.fill.visible = f > 0; o.fill.scale.x = Math.max(0.01, SW * f); o.fill.scale.z = TW; o.fill.position.x = o.xs + SW * f / 2;
      const sp = Math.max(0, d - f); o.spoil.visible = sp > 0.02; o.spoil.scale.set(SW * 0.5 * Math.max(d, 0.05), 1.5 * sp + 0.05, 1.5);
    }
    const STAGE = { exc:segX(2) + 40, pipe:segX(4) + 60, back:segX(9) + 50 };
    TRADES.forEach((tr, i) => {
      const f = fleets[tr], st = S.st[i] || 'off';
      const x = st === 'ready' ? STAGE[tr] : SEG_X0 + (S.ft[i] || 0) / 300 * SEGMENTS * SEG_W;
      setFleet3(tr, st === 'off' ? null : ((S.qty && S.qty[i]) || { Standard:1 }));
      f.st = st; f.g.visible = st !== 'off'; f.g.position.x = X(x);
      f.crew.visible = st === 'work' || st === 'ready';
      if (f.lab){ f.lab.visible = f.g.visible; f.lab.position.set(X(x) - 2, tr === 'pipe' ? 12 : 9, Z[tr]); }
      f.zz.visible = false;
    });
    const ck = S.cam == null ? 'over' : S.cam;
    if (ck !== view.camKey){ view.camKey = ck; view.user = false; view.theta = -0.62;
      if (ck === 'over'){ view.mode = 'whole'; view.focus = null; view.phi = 0.55; } else { view.mode = 'follow'; view.focus = TRADES[ck]; view.phi = 0.40; }

  }
  function animate(u, work, tt, i){
    const ph = tt * 2.4 + i * 1.3, p = u.parts;
    if (u.kind === 'exc'){
      if (work){
        p.boom.rotation.z = -0.38 + 0.26 * Math.sin(ph);
        p.stick.rotation.z = 0.15 + 0.3 * Math.sin(ph + 1.2);
        p.bucket.rotation.z = 0.4 * Math.sin(ph + 2.2);
        p.house.rotation.y = u.base + 0.22 * Math.sin(ph * 0.5);
      } else { p.boom.rotation.z = -0.3; p.stick.rotation.z = 0.35; p.bucket.rotation.z = 0.3; p.house.rotation.y = u.base; }
      return;
    }
    const L = (u.kind === 'crane' ? u.tipY - 2.2 : 4.3) + (work ? 1.1 * (0.5 + 0.5 * Math.sin(ph * 0.6)) : 0);
    p.cable.scale.y = L; p.cable.position.y = -L / 2; p.hook.position.y = -L;
  }
  function loop(now){
    raf = 0;
    if (!R || !R.domElement.isConnected) return;
    const el = R.domElement, w = el.clientWidth, h = el.clientHeight;
    if (w && h && (w !== lastW || h !== lastH)){ lastW = w; lastH = h; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); fit(); }
    const tt = (now - t0) / 1000, still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    TRADES.forEach(tr => {
      const f = fleets[tr], work = f.st === 'work' && !still;
      f.units.forEach((u, i) => animate(u, work, tt, i));
      if (f.zz.visible) f.zz.position.y = (tr === 'pipe' ? 14 : 11.2) + 0.4 * Math.sin(tt * 2.5);
    });
    let want = 0, wantD = view.dist;
    if (view.mode === 'follow'){
      const fs = (view.focus ? [fleets[view.focus]] : TRADES.map(tr => fleets[tr])).filter(f => f.g.visible && (view.focus || f.st !== 'done'));
      const lo = fs.map(f => f.g.position.x - f.units.reduce((a, u) => a + u.len + 1.4, 0)), hi = fs.map(f => f.g.position.x + 4);
      if (fs.length){ want = (Math.min(...lo) + Math.max(...hi)) / 2;
        if (!view.user) wantD = Math.max(view.dist, (Math.max(...hi) - Math.min(...lo)) * 0.95 / Math.max(0.6, Math.min(1.6, lastW / Math.max(1, lastH))) + 16); }
    }
    const dt = prev ? Math.min(0.5, (now - prev) / 1000) : 0.016; prev = now; const k = 1 - Math.exp(-dt * 5);
    view.tx += (want - view.tx) * k;
    view.cd = view.cd == null || view.user ? wantD : view.cd + (wantD - view.cd) * k;
    const D = view.mode === 'follow' ? view.cd : view.dist, ph = view.phi, th = view.theta;
    cam.position.set(view.tx + D * Math.cos(ph) * Math.sin(th), view.ty + D * Math.sin(ph), view.tz + D * Math.cos(ph) * Math.cos(th));
    cam.lookAt(view.tx, view.ty - 1.5, view.tz);
    sun.position.set(view.tx - 35, 70, 45); sun.target.position.set(view.tx, 0, 0);
    R.render(scene, cam);
    raf = requestAnimationFrame(loop);
  }
  return { supported, active, sync, why:() => S3why };
})();

/* LOB + bar chart picture of what the player built (drawn from the data, so it matches the plan exactly) */
function snapPNG({title,sub,tMax,deadline,crews,hits}){
  const col=c=>{const m=/^var\((--[\w-]+)\)$/.exec(c||'');if(!m)return c;const v=getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim();return v||'#555'};
  crews=crews.map(c=>({...c,c:col(c.c)}));
  try{const W=1000,H=780,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
    g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#264653';g.font='bold 22px sans-serif';g.fillText(title,24,34);g.font='14px sans-serif';g.fillStyle='#555';g.fillText(sub||'',24,56);
    const x0=150,x1=W-30,X=t=>x0+t/tMax*(x1-x0);
    const grid=(yA,yB)=>{g.strokeStyle='#e6e1d6';g.lineWidth=1;for(let d=0;d<=tMax;d++){g.beginPath();g.moveTo(X(d),yA);g.lineTo(X(d),yB);g.stroke()}
      g.fillStyle='#666';g.font='12px sans-serif';for(let d=0;d<=tMax;d+=tMax>24?4:2)g.fillText(String(d),X(d)-4,yB+16);
      if(deadline!=null){g.strokeStyle='#E63946';g.setLineDash([6,4]);g.lineWidth=2;g.beginPath();g.moveTo(X(deadline),yA);g.lineTo(X(deadline),yB);g.stroke();g.setLineDash([])}};
    /* bar chart */
    const bA=80,rowH=46;g.fillStyle='#264653';g.font='bold 15px sans-serif';g.fillText('Bar chart',24,bA-6);grid(bA,bA+3*rowH);
    crews.forEach((c,i)=>{const y=bA+i*rowH+8;g.fillStyle='#264653';g.font='bold 13px sans-serif';g.fillText(c.tag,24,y+20);
      if(c.S==null)return;g.fillStyle=c.c;g.fillRect(X(c.S),y,X(c.E)-X(c.S),rowH-16);
      (c.red||[]).forEach(s=>{g.fillStyle='rgba(0,0,0,.35)';g.fillRect(X(s.a),y,X(s.b)-X(s.a),rowH-16)});
      g.fillStyle='#fff';g.font='bold 12px sans-serif';g.fillText('Day '+c.S+' → '+c.E,X(c.S)+6,y+19)});
    g.fillStyle='#666';g.font='12px sans-serif';g.fillText('day',x1-20,bA+3*rowH+30);
    /* LOB */
    const lA=bA+3*rowH+70,lB=H-50,Y=ft=>lB-ft/PJ*(lB-lA);g.fillStyle='#264653';g.font='bold 15px sans-serif';g.fillText('Line of Balance',24,lA-10);grid(lA,lB);
    g.strokeStyle='#e6e1d6';for(let f=0;f<=PJ;f+=75){g.beginPath();g.moveTo(x0,Y(f));g.lineTo(x1,Y(f));g.stroke();g.fillStyle='#666';g.fillText(f+' ft',x0-50,Y(f)+4)}
    crews.forEach(c=>{const ln=(pts,dash,w)=>{if(!pts||!pts.length)return;g.strokeStyle=c.c;g.lineWidth=w;g.setLineDash(dash?[7,5]:[]);g.beginPath();pts.forEach(([t,x],k)=>k?g.lineTo(X(t),Y(x)):g.moveTo(X(t),Y(x)));g.stroke();g.setLineDash([])};
      ln(c.plan,true,2);ln(c.pts,false,4)});
    (hits||[]).forEach(h=>{g.strokeStyle='#E63946';g.lineWidth=3;g.beginPath();g.arc(X(h.t),Y(h.ft),9,0,7);g.stroke()});
    let lx=x0;crews.forEach(c=>{g.fillStyle=c.c;g.fillRect(lx,H-24,14,10);g.fillStyle='#333';g.font='12px sans-serif';g.fillText(c.tag+(c.rate!=null?' · '+c.rate+' ft/d':''),lx+18,H-15);lx+=210});
    if(crews.some(c=>c.plan)){g.fillStyle='#555';g.fillText('dashed = planned · solid = actual',x1-210,H-15)}
    return cv.toDataURL('image/png')}catch(e){return null}}
const planShot=(title,plan,rates,deadline)=>snapPNG({title,sub:'Participant '+(DL.pid||'—')+' · '+new Date().toLocaleString(),deadline,
  tMax:Math.max(16,Math.ceil(Math.max(...plan.map(p=>p.S+p.D)))+2),
  crews:CREWS.map((c,i)=>({tag:c.tag,c:c.c,rate:rates[i],S:plan[i].S,E:plan[i].S+plan[i].D,pts:[[plan[i].S,0],[plan[i].S+plan[i].D,PJ]]}))});
function Info({k}){const d=INFO[k];const ref=useRef(null);const [pos,setPos]=useState(null);
  useEffect(()=>{const h=e=>{if(e.detail!==ref.current)setPos(null)};infoBus.addEventListener('open',h);return()=>infoBus.removeEventListener('open',h)},[]);
  useEffect(()=>{if(!pos)return;
    const close=e=>{if(e.type==='keydown'&&e.key!=='Escape')return;const t=e.target;if(e.type==='pointerdown'&&t&&(ref.current.contains(t)||(t.closest&&t.closest('.infopop'))))return;setPos(null)};
    const follow=()=>{const p=place();if(!p)setPos(null);else setPos(p)};
    window.addEventListener('pointerdown',close,true);window.addEventListener('keydown',close);window.addEventListener('resize',follow);document.addEventListener('scroll',follow,true);
    return()=>{window.removeEventListener('pointerdown',close,true);window.removeEventListener('keydown',close);window.removeEventListener('resize',follow);document.removeEventListener('scroll',follow,true)}},[!!pos]);
  function place(){const el=ref.current;if(!el)return null;const r=el.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight||(r.width===0&&r.height===0))return null;
    const W=Math.min(300,innerWidth-16),x=Math.min(Math.max(8,r.left+r.width/2-W/2),innerWidth-W-8),below=r.bottom+230<innerHeight;
    return{x,W,top:below?r.bottom+8:null,bot:below?null:innerHeight-r.top+8}}
  const toggle=e=>{e.stopPropagation();e.preventDefault();if(pos){setPos(null);return}
    const p=place();if(!p)return;setPos(p);infoBus.dispatchEvent(new CustomEvent('open',{detail:ref.current}));logInfo(k)};
  return(<><button ref={ref} type="button" className="info" aria-label={'What is '+d.t+'?'} aria-expanded={!!pos} onPointerDown={e=>e.stopPropagation()} onClick={toggle}>i</button>
    {pos&&ReactDOM.createPortal(<div className="infopop" role="dialog" aria-label={d.t} style={{left:pos.x,width:pos.W,top:pos.top==null?'auto':pos.top,bottom:pos.bot==null?'auto':pos.bot}}>
      <b>{d.t}</b><p>{d.w}</p><p className="why"><span>Why it matters</span>{d.y}</p>{d.e&&<p className="ex">e.g. {d.e}</p>}</div>,document.body)}</>)}

/* ===== SHARED UI ===== */
function useClock(){
  const [t,setT]=useState(0);const [run,setRun]=useState(false);const lim=useRef(0);const rate=useRef(1.4);
  useEffect(()=>{if(!run)return;let raf,last=performance.now();
    const step=now=>{const dt=Math.min(.1,(now-last)/1000);last=now;let stop=false;
      setT(p=>{let n=p+dt*rate.current;if(n>=lim.current){n=lim.current;stop=true}return n});
      if(stop)setRun(false);else raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step);return()=>cancelAnimationFrame(raf)},[run]);
  return{t,run,rate,play(from,to){if(from!=null)setT(from);lim.current=to;setRun(true)},set:setT,stop(){setRun(false)}};
}
function Banner({m}){if(!m)return null;return(<div key={m.n||0} className={'banner '+m.k+(m.k==='bad'?' shake':'')} role="status">{m.t}</div>)}
function Stats({items}){return(<div className="hud">{items.map((s,i)=>(<div key={i} className={'stat '+(s.k||'')}><small>{s.l}</small><span className="num">{s.v}</span></div>))}</div>)}
function Legend(){return(<div className="legend">{CREWS.map(c=><span key={c.k}><i style={{background:c.c}}/>{c.ic} {c.tag}</span>)}</div>)}
function Pills({items,cur}){return(<span className="pills">{items.map((x,i)=><span key={i} className={cur===i?'on':cur>i?'ok':''}>{cur>i?'✓ ':''}{x}</span>)}</span>)}

/* pointer drag & drop */
const DND={zones:new Map(),setGhost:null};
function DropZone({id,onDrop,className,style,children}){useEffect(()=>{DND.zones.set(id,onDrop);return()=>{DND.zones.delete(id)}});return(<div data-drop={id} className={className} style={style}>{children}</div>)}
function Draggable({payload,label,color,onTap,disabled,className,style,children,ariaLabel}){
  const st=useRef(null);const end=()=>{st.current=null;DND.setGhost&&DND.setGhost(null)};
  return(<div className={className} style={{...style,touchAction:disabled?'auto':'none',cursor:disabled?'default':'grab',userSelect:'none',WebkitUserSelect:'none'}} role="button" tabIndex={disabled?-1:0} aria-label={ariaLabel}
    onPointerDown={e=>{if(disabled)return;e.preventDefault();st.current={x:e.clientX,y:e.clientY,drag:false};e.currentTarget.setPointerCapture(e.pointerId)}}
    onPointerMove={e=>{const s=st.current;if(!s)return;if(!s.drag&&Math.hypot(e.clientX-s.x,e.clientY-s.y)>6)s.drag=true;
      if(s.drag){DND.setGhost&&DND.setGhost({x:e.clientX,y:e.clientY,label,color})}}}
    onPointerUp={e=>{const s=st.current;end();if(!s)return;if(!s.drag){onTap&&onTap();return}
      const el=document.elementFromPoint(e.clientX,e.clientY);const z=el&&el.closest('[data-drop]');if(z){const h=DND.zones.get(z.getAttribute('data-drop'));h&&h(payload)}}}
    onPointerCancel={end} onKeyDown={e=>{if(!disabled&&onTap&&(e.key==='Enter'||e.key===' ')){e.preventDefault();onTap()}}}>{children}</div>);
}
function Ghost(){const [g,setG]=useState(null);DND.setGhost=setG;return g?(<div className="dragghost" style={{left:g.x,top:g.y,background:g.color}}>{g.label}</div>):null}

/* live 3D site card (right) with optional player bar and camera views */
const CAMS=[['over','🎥 Overview'],[0,'🚜 Excavation'],[1,'🏗️ Pipe laying'],[2,'🚛 Backfill']];
function Site({ft=[0,0,0],st=['off','off','off'],qty,focus=null,clock='',clash:cl=null,player=null,alert=null}){
  const cv=useRef(null);const [cam,setCam]=useState(focus==null?'over':focus);const [,bump]=useState(0);
  useEffect(()=>{window.__s3fail=()=>bump(x=>x+1);return()=>{window.__s3fail=null}},[]);
  useEffect(()=>{if(focus!=null)setCam(focus)},[focus]);
  useEffect(()=>{try{S3.sync(cv.current,{ft,st,qty,cam})}catch(e){console.warn(e)}});
  const ok=S3.supported();
  return(<div className="rcol"><div className="sitecard">
    <div className="sitehd"><span className="ttl">🏗 3D site · 300 ft</span><span className="clock">{clock}</span></div>
    <div className="sitewrap">
      <div className="cv" ref={cv}/>
      {!ok&&<div className="no3d"><div><b>The 3D site needs WebGL.</b><br/>{S3.why()||'WebGL is not available.'}<br/>In Chrome: Settings → System → “Use graphics acceleration when available”, then reload.</div></div>}
      {ok&&<span className="v3hint">🖱 drag to orbit · scroll to zoom</span>}
      {alert&&<div className="clashov evt"><div className="cbig">{alert.big}</div><div className="cmsg">{alert.msg}</div></div>}
      {cl&&<div className="clashov"><div className="cbig">💥 COLLISION</div><div className="cmsg">{cl}</div></div>}
      {player&&<div className="player">
        {!player.run?<button className="pbtn" disabled={player.disabled} onClick={player.onPlay} aria-label="Play">▶</button>:<button className="pbtn" onClick={player.onPause} aria-label="Pause">⏸</button>}
        <input aria-label="Progress" type="range" min={player.min} max={player.max} step="0.1" value={player.t} disabled={player.disabled} onChange={e=>player.onScrub(+e.target.value)}/>
        <span className="pday num">Day {player.t.toFixed(1)}</span>
        <span className="spdsw dark">{[.5,1,2,4].map(v=><button key={v} className={player.spd===v?'on':''} onClick={()=>player.setSpd(v)}>{v}×</button>)}</span>
      </div>}
    </div>
    <div className="camsw" role="group" aria-label="Camera view">{CAMS.map(([k,l])=><button key={k} className={cam===k?'on':''} onClick={()=>setCam(k)}>{l}</button>)}</div>
    <div className="crewchips">{CREWS.map((c,i)=>{const s=st[i];if(s==='off')return null;
      return <span key={c.k} className={'cchip '+s}>{c.ic} {c.tag} · {Math.round(ft[i])} ft</span>})}</div>
  </div></div>);
}

/* LOB chart (fills the space it is given) */
function svgPoint(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):null}
function Lob({tMax=16,lines=[],points=[],ring=null,hit=null,cursor=null,onPick,drag=null,attempt=null,deadline=null,note=null,bands=null,paths=null,upto=null,hits=null}){
  const ref=useRef(null),dr=useRef(null);
  const W=360,L=40,R=14,T=14,B=30,ph=200,H=T+ph+B,pw=W-L-R;
  const x=t=>L+t/tMax*pw,y=f=>T+ph-f/PJ*ph;
  const tOf=e=>{const p=svgPoint(ref.current,e);return p?(p.x-L)/pw*tMax:null};
  const click=e=>{if(!onPick||dr.current)return;const p=svgPoint(ref.current,e);if(!p)return;
    const t=Math.round((p.x-L)/pw*tMax),f=Math.round(((T+ph-p.y)/ph*PJ)/25)*25;
    if(t<0||t>tMax||f<0||f>PJ)return;onPick(t,f)};
  const step=tMax<=18?2:4,xt=[],vg=[],hg=[];for(let t=0;t<=tMax;t+=step)xt.push(t);for(let t=0;t<=tMax;t++)vg.push(t);for(let f=0;f<=PJ;f+=25)hg.push(f);
  return(<svg ref={ref} viewBox={`0 0 ${W} ${H}`} className={'lob'+(onPick?' pick':'')} data-tmax={tMax} onClick={click} role="img" aria-label="Line of Balance: days across, feet up"
      onPointerMove={e=>{const d=dr.current;if(!d)return;const t=tOf(e);if(t==null)return;if(d.kind==='path'){let k=Math.round(t-d.t0);k=Math.max(d.min,Math.min(d.max,k));if(k!==d.last){d.last=k;d.fn(k)}return}let s=Math.round(d.S0+t-d.t0);s=Math.max(d.min,Math.min(d.max,s));if(s!==d.last){d.last=s;drag.onMove(d.i,s)}}}
      onPointerUp={()=>{if(dr.current)setTimeout(()=>{dr.current=null},0)}}>
    <rect className="plot" x={L} y={T} width={pw} height={ph} rx="6"/>
    {vg.map(t=><line key={'v'+t} className={t%step===0?'g2':'g1'} x1={x(t)} x2={x(t)} y1={T} y2={T+ph}/>)}
    {hg.map(f=><line key={'h'+f} className={f%75===0?'g2':'g1'} x1={L} x2={L+pw} y1={y(f)} y2={y(f)}/>)}
    {[0,75,150,225,300].map(f=><text key={'y'+f} className="ax" x={L-5} y={y(f)+3.5} textAnchor="end">{f}</text>)}
    {xt.map(t=><text key={'x'+t} className="ax" x={x(t)} y={T+ph+13} textAnchor="middle">{t}</text>)}
    <text className="axt" x={L+pw} y={H-4} textAnchor="end">DAY →</text>
    <text className="axt" x={L+4} y={T+10} textAnchor="start">FT ↑</text>
    {bands&&bands.map((b,i)=><g key={'b'+i}><rect className="evband" x={x(b.a)} y={T} width={x(b.b)-x(b.a)} height={ph}/><text className="evlab" x={x(b.a)+3} y={T+10+i*11}>{b.label}</text></g>)}
    {deadline!=null&&deadline<=tMax&&<g><line className="dline" x1={x(deadline)} x2={x(deadline)} y1={T} y2={T+ph}/><text className="dtxt" x={x(deadline)-3} y={T+ph-5} textAnchor="end">🎯 day {deadline}</text></g>}
    {note&&<text className={'notetxt'+(note.bad?' bad':'')} x={L+pw-4} y={T+12} textAnchor="end">{note.t}</text>}
    {lines.filter(l=>l.ghost).map((l,i)=>{const E=l.S+l.D;return(<g key={'g'+i}>
      <line x1={x(l.S)} y1={y(0)} x2={x(E)} y2={y(PJ)} style={{stroke:l.c}} strokeWidth="9" strokeDasharray="6 6" opacity=".28" strokeLinecap="round"/>
      <text className="ghostlab" x={(x(l.S)+x(E))/2+9} y={y(PJ/2)+4} style={{fill:l.c}}>◀ day {l.S}</text></g>)})}
    {lines.map((l,i)=>{if(l.ghost)return null;const E=l.S+l.D,can=drag&&drag.idx.includes(i);return(<g key={'l'+i}>
      <line x1={x(l.S)} y1={y(0)} x2={x(E)} y2={y(PJ)} style={{stroke:l.c}} strokeWidth={l.dash?1.6:3.2} strokeDasharray={l.dash?'4 4':undefined} opacity={l.dash?.5:1} strokeLinecap="round"/>
      {!l.dash&&<circle cx={x(l.S)} cy={y(0)} r="3.8" style={{fill:l.c}}/>}
      {!l.dash&&<circle cx={x(E)} cy={y(PJ)} r="3.8" style={{fill:l.c}}/>}
      {l.lab&&(()=>{const f=l.labFr||.5;return <text className="slab" x={x(l.S+(E-l.S)*f)-6} y={y(PJ*f)-4} textAnchor="end" style={{fill:l.c}}>{l.lab}</text>})()}
      {can&&<line className="grab" x1={x(l.S)} y1={y(0)} x2={x(E)} y2={y(PJ)} style={{stroke:'transparent',pointerEvents:'stroke'}} strokeWidth="20" fill="none"
        onPointerDown={e=>{e.stopPropagation();ref.current.setPointerCapture(e.pointerId);const lim=drag.lim[drag.idx.indexOf(i)];dr.current={i,S0:l.S,t0:tOf(e),min:lim[0],max:lim[1],last:l.S}}}/>}
      {can&&<text className="grabhint" x={x(E)+3} y={y(PJ)+12} style={{fill:l.c}}>↔</text>}
    </g>)})}
    {paths&&paths.map((p,i)=>{const P=q=>x(q.t)+','+y(q.x);const done=upto==null?p.pts:p.pts.filter(q=>q.t<=upto+1e-9);const fut=upto==null?[]:p.pts.filter(q=>q.t>=upto-1e-9);
      if(upto!=null&&done.length&&upto<p.pts[p.pts.length-1].t-1e-9){const m=posAt(p.pts,upto);done.push({t:upto,x:m.x,w:m.w});fut.unshift({t:upto,x:m.x,w:m.w})}
      const segs=[];let cur=[];p.pts.forEach((q,k)=>{if(q.w){if(!cur.length&&k>0)cur.push(p.pts[k-1]);cur.push(q)}else if(cur.length){segs.push(cur);cur=[]}});if(cur.length)segs.push(cur);
      const last=done[done.length-1];
      return(<g key={'pa'+i}>
        {fut.length>1&&<polyline points={fut.map(P).join(' ')} fill="none" style={{stroke:p.c}} strokeWidth="2.8" opacity=".5" strokeDasharray="7 4" strokeLinejoin="round"/>}
        {done.length>1&&<polyline points={done.map(P).join(' ')} fill="none" style={{stroke:p.c}} strokeWidth="3.2" strokeLinejoin="round"/>}
        {segs.map((sg,k)=><polyline key={k} className="waitseg" points={sg.map(P).join(' ')}/>)}
        {last&&done.length>1&&<circle cx={x(last.t)} cy={y(last.x)} r="4.2" style={{fill:p.c,stroke:'var(--card)'}} strokeWidth="1.5"/>}
        {p.drag&&<polyline className="grab" points={(fut.length>1?fut:p.pts).map(P).join(' ')} fill="none" style={{stroke:'transparent',pointerEvents:'stroke'}} strokeWidth="22"
          onPointerDown={ev=>{ev.stopPropagation();ref.current.setPointerCapture(ev.pointerId);dr.current={kind:'path',t0:tOf(ev),last:0,min:p.drag.min,max:p.drag.max,fn:p.drag.onMove}}}/>}
        {p.drag&&(()=>{const e2=p.pts[p.pts.length-1];return <text className="grabhint" x={x(e2.t)+4} y={y(e2.x)+14} style={{fill:p.c}}>↔</text>})()}
      </g>)})}
    {points.map((p,i)=><circle key={'p'+i} className="pt" cx={x(p.t)} cy={y(p.ft)} r="5" style={{fill:p.c}}/>)}
    {attempt&&<circle cx={x(attempt.t)} cy={y(attempt.ft)} r="7" style={{fill:'none',stroke:attempt.lvl==='amber'?'var(--amber)':'var(--bad)'}} strokeWidth="2.6"/>}
    {ring&&<g><circle className="ring" cx={x(ring.t)} cy={y(ring.ft)} r="8"/>
      <text className="ringlab" x={x(ring.t)+(ring.t>tMax-4?-11:11)} y={y(ring.ft)+(ring.ft>=PJ?15:-9)} textAnchor={ring.t>tMax-4?'end':'start'}>day {ring.t}, {ring.ft} ft</text></g>}
    {cursor!=null&&<g><line className="cur" x1={x(cursor)} x2={x(cursor)} y1={T} y2={T+ph}/>
      {lines.filter(l=>!l.dash&&!l.ghost&&cursor>=l.S).map((l,i)=><circle key={'c'+i} cx={x(cursor)} cy={y(ftAt(l.S,l.D,cursor))} r="4.5" style={{fill:l.c,stroke:'var(--card)'}} strokeWidth="1.5"/>)}</g>}
    {hits&&hits.map((h,i)=><g key={'hh'+i}><circle className="hit" cx={x(h.t)} cy={y(h.ft)} r="10"/>
      <text className="hitlab" x={x(h.t)+(h.t>tMax-6?-14:14)} y={y(h.ft)+(h.ft>250?18:-12)} textAnchor={h.t>tMax-6?'end':'start'}>💥 {Math.round(h.ft)} ft · day {fmt(+h.t.toFixed(1))}</text></g>)}
    {hit&&<g><circle className="hit" cx={x(hit.t)} cy={y(hit.ft)} r="10"/>
      <text className="hitlab" x={x(hit.t)+(hit.t>tMax-6?-14:14)} y={y(hit.ft)+(hit.ft>250?18:-12)} textAnchor={hit.t>tMax-6?'end':'start'}>💥 {Math.round(hit.ft)} ft · day {fmt(hit.t)}</text></g>}
  </svg>);
}

/* timeline (bar chart) */
function Timeline({tMax,rows,onDropRow,onSlide,narrow,deadline}){
  const ticks=[];for(let t=0;t<=tMax;t+=2)ticks.push(t);
  return(<div className={'tl'+(narrow?' narrow':'')}>
    {rows.map((r,i)=>(<div key={i} className="tl-row">
      <div className="tl-lab" style={{color:r.c}} title={r.tag}>{r.ic}{narrow?'':' '+r.tag}</div>
      <DropZone id={'row'+i} onDrop={ci=>onDropRow&&onDropRow(i,ci)} className={'track'+(r.hot?' hot':'')} style={{'--tmax':tMax}}>
        {deadline!=null&&<div className="dl" style={{left:(deadline/tMax*100)+'%'}}/>}
        {r.flag!=null&&!r.locked&&<div className="flag" style={{left:(r.flag/tMax*100)+'%'}}><span>🎯 Day {r.flag}</span></div>}
        {r.placed&&<SlideBar r={r} tMax={tMax} onSlide={s=>onSlide&&onSlide(i,s)}/>}
        {!r.placed&&r.hot&&<span className="dropme">⬇ drop the bar here</span>}
      </DropZone>
      <div className={'tl-st '+(r.locked?'ok':'')}>{r.st}</div>
    </div>))}
    <div className="tl-axis"><div/><div className="ax">{ticks.map(t=><span key={t} style={{left:(t/tMax*100)+'%'}}>{t}</span>)}{deadline!=null&&<b className="dlab" style={{left:(deadline/tMax*100)+'%'}}>🎯 day {deadline}</b>}</div><div className="tl-st">{narrow?'':'day'}</div></div>
  </div>);
}
function SlideBar({r,tMax,onSlide}){
  const g=useRef(null);const tAt=e=>{const b=e.currentTarget.parentElement.getBoundingClientRect();return(e.clientX-b.left)/b.width*tMax};
  const can=r.canSlide,fp=r.fill!=null?Math.max(0,Math.min(1,r.fill))*100:null,mn=r.min||0;
  return(<div className={'bar'+(can?' slide':'')+(r.locked?' locked':'')} style={{left:(r.S/tMax*100)+'%',width:(r.D/tMax*100)+'%',background:r.c}}
    onPointerDown={can?e=>{e.currentTarget.setPointerCapture(e.pointerId);g.current=tAt(e)-r.S}:undefined}
    onPointerMove={can?e=>{if(g.current==null)return;const s=Math.max(mn,Math.min(tMax-r.D,Math.round(tAt(e)-g.current)));if(s!==r.S)onSlide(s)}:undefined}
    onPointerUp={()=>{g.current=null}} onPointerCancel={()=>{g.current=null}}
    tabIndex={can?0:-1} onKeyDown={can?e=>{if(e.key==='ArrowRight')onSlide(Math.min(tMax-r.D,r.S+1));if(e.key==='ArrowLeft')onSlide(Math.max(mn,r.S-1))}:undefined}
    aria-label={r.tag+' bar, day '+r.S+' to '+(r.S+r.D)}>
    {fp!=null&&<span className="fp" style={{width:fp+'%'}}/>}<span style={{position:'relative'}}>{can?'↔ ':''}{r.S} → {r.S+r.D}</span></div>);
}

/* measure card: slide to 300 ft, the full bar becomes draggable */
function Measure({i,rate,cost,g,setG,onTapBar,bare}){
  const c=CREWS[i],d=durOf(rate),ft=g*rate,ok=g===d,over=g>d,pct=Math.min(100,ft/PJ*100);
  return(<div className={bare?'':'dock'}>

      {!bare&&<span className="unitnote">ft/d = feet built per day · $/d = paid per working day</span>}</div>
    {ok?<Draggable payload={i} label={c.ic+' '+d+' days'} color={c.c} onTap={onTapBar} className="pb full" ariaLabel={'Drag the '+d+'-day bar to row '+(i+1)}>
         <i style={{width:'100%',background:c.c}}/><span>☰ {d} days · {money(d*cost)} · drag to row {i+1} ⬆</span></Draggable>
       :<div className="pb"><i style={{width:pct+'%',background:over?'var(--bad)':c.c}}/><span>{over?'OVERSHOT — slide back':Math.min(ft,PJ)+' / 300 ft'}</span></div>}

/* plotting helper */
function usePlot(TP,miss){
  const [k,setK]=useState(0);const [m,setM]=useState(null);const [att,setAtt]=useState(null);const n=useRef(0);
  function pick(t,f){if(k>=TP.length)return;const g=TP[k];n.current++;
    if(t===g.t&&f===g.ft){setK(k+1);setAtt(null);setM({k:'good',t:'✓ '+CREWS[g.ci].tag+' '+(k%2?'END':'START')+' · day '+g.t+', '+g.ft+' ft',n:n.current});Snd.ok();return}
    const near=Math.abs(t-g.t)<=1&&Math.abs(f-g.ft)<=25;setAtt({t,ft:f,lvl:near?'amber':'red'});miss();
    setM({k:near?'amber':'bad',t:(near?'≈ Close — tap the ring exactly':'✗ Tap the yellow ring'),n:n.current})}
  return{k,m,att,pick,reset(){setK(0);setM(null);setAtt(null)}};
}
const plotLines=(plan,TP,k)=>{const lines=[],pts=[];for(let i=0;i<3;i++){if(k>=i*2+2)lines.push({...plan[i],c:CREWS[i].c});else if(k>=i*2+1)pts.push({t:TP[i*2].t,ft:0,c:CREWS[i].c})}return{lines,pts}};
const targets=plan=>{const TP=[];plan.forEach((p,i)=>{TP.push({ci:i,t:p.S,ft:0});TP.push({ci:i,t:endOf(p),ft:300})});return TP};

/* schedule & budget table (as in the original T1) */

      {done&&<><tr className="tot"><td colSpan="5">Project duration<Info k="projdur"/> (Day {Math.min(...plan.map(p=>p.S))} → Day {projEnd(plan)})</td><td className="r">{projDur(plan)}</td><td/></tr>

/* ===== TRAINING 1 · SEQUENCE ===== */
function M1({miss,done}){
  const [rows,setRows]=useState([null,null,null]);const [m,setM]=useState(null);const [focus,setFocus]=useState(null);const n=useRef(0);const wrong=useRef([]);
  const why=ci=>ci===2?'✗ No pipe to backfill yet.':ci===1?'✗ No trench to lay pipe in yet.':'✗ Not yet.';
  function place(ci,row){if(rows.includes(ci))return;if(row==null)row=rows.indexOf(null);if(row<0||rows[row]!=null)return;n.current++;
    if(ci===row){const r=rows.slice();r[row]=ci;setRows(r);setM(null);setFocus(ci);DL.ev('placed',{crew:CREWS[ci].tag,slot:row+1});Snd.ok()}
    else{wrong.current.push(CREWS[ci].tag+'→slot '+(row+1));DL.ev('wrong_order',{crew:CREWS[ci].tag,slot:row+1});miss();setM({k:'bad',t:why(ci),n:n.current})}}
  const full=rows.every(r=>r!=null);
  return(<Split site={<Site ft={[0,0,0]} st={[0,1,2].map(i=>rows.includes(i)?'ready':'off')} focus={focus}/>}>
    <div className="board">
      <div className="tray">{[2,1,0].map(ci=>{const c=CREWS[ci],used=rows.includes(ci);return(
        <Draggable key={c.k} payload={ci} label={c.ic+' '+c.tag} color={c.c} disabled={used} onTap={()=>place(ci,null)} className={'tile'+(used?' used':'')} style={{'--tc':c.c}} ariaLabel={c.tag}>
          <span className="ico">{c.ic}</span><b style={{color:c.c}}>{c.tag}</b><small>Rate {c.rate} ft/d</small><small>Daily cost {money(c.cost)}/d</small></Draggable>)})}</div>
      <div className="unitnote">ft/d = rate, feet built per day<Info k="rate"/> · $/d = daily cost, paid for every working day<Info k="daily"/></div>
      <div className="slots">{[0,1,2].map(i=>{const ci=rows[i],c=ci!=null?CREWS[ci]:null;return(
        <DropZone key={i} id={'seq'+i} onDrop={x=>place(x,i)} className={'slot'+(c?' filled':'')} style={c?{'--tc':c.c}:undefined}>
          <span className="n">{i+1}</span>{c?<><span className="ico">{c.ic}</span><span style={{color:c.c}}>{c.tag}</span></>:<span className="hintx">{i===0?'first crew on site':'drop a crew here'}</span>}</DropZone>)})}</div>
    </div>
    <Banner m={m}/>
    {full&&<div className="banner good">✓ Excavation → Pipe laying → Backfill<span className="sp"/><button className="go" onClick={()=>{DL.set({wrong_moves:wrong.current.join('; ')});done()}}>Finish ▶</button></div>}
  </Split>);
}

/* ===== TRAINING 2 · BAR CHART + MINI-QUEST + SCHEDULE & BUDGET ===== */
function M2({miss,done}){
  const TG=[1,1,6];
  const [g,setG]=useState([0,0,0]);const [placed,setPlaced]=useState([false,false,false]);const [S,setS]=useState([0,0,0]);const [m,setM]=useState(null);const n=useRef(0);
  const locked=S.map((s,i)=>placed[i]&&s===TG[i]),active=locked.indexOf(false),all=active<0;
  function dropRow(row,ci){if(ci!==active||g[ci]!==D[ci]||placed[ci])return;n.current++;
    if(row!==ci){DL.ev('wrong_row',{crew:CREWS[ci].tag,row:row+1});miss();setM({k:'bad',t:'✗ '+CREWS[ci].tag+' belongs in row '+(ci+1),n:n.current});return}
    const p=placed.slice();p[ci]=true;setPlaced(p);setM(null);DL.ev('bar_placed',{crew:CREWS[ci].tag});Snd.ok()}
  function slide(i,s){if(locked[i])return;if(s!==S[i])DL.inc('bar_moves');const x=S.slice();x[i]=s;setS(x);if(s===TG[i])Snd.ok()}
  const plan=CREWS.map((c,i)=>({S:S[i],D:D[i]}));
  const ft=CREWS.map((c,i)=>i===active?Math.min(PJ,g[i]*c.rate):(all||i<active)?PJ:0);
  return(<Split compact={all} site={<Site ft={ft} st={CREWS.map((c,i)=>all||i<active?'done':i===active?(g[i]>0?'work':'ready'):'off')} focus={all?null:active} clock={all?'':'Day '+g[active]}/>}>
    {!all&&<div className="quest"><span className="qhd">🎯 MINI-QUEST <span className="qn">{locked.filter(Boolean).length}/3</span></span>
      <span className="qtxt">Drag each bar to its assigned start day:</span>
      {CREWS.map((c,i)=><span key={c.k} className={'qchip'+(locked[i]?' ok':i===active&&placed[i]?' now':'')}>{locked[i]?'✓':'🎯'} {c.tag} → Day {TG[i]}</span>)}</div>}
    <div className="board"><div className="bhd">📊 Bar chart<Info k="bar"/></div>
      <Timeline tMax={16} onDropRow={dropRow} onSlide={slide} rows={CREWS.map((c,i)=>({...c,placed:placed[i],S:S[i],D:D[i],locked:locked[i],canSlide:placed[i]&&!locked[i],
        hot:i===active&&g[i]===D[i]&&!placed[i],flag:TG[i],st:locked[i]?'✓':''}))}/></div>
    {!all&&placed[active]&&<div className="banner amber">↔ Drag the {CREWS[active].tag} bar to 🎯 Day {TG[active]}</div>}
    {!all&&!placed[active]&&<Measure i={active} rate={CREWS[active].rate} cost={CREWS[active].cost} g={g[active]} setG={v=>{const x=g.slice();x[active]=v;setG(x)}} onTapBar={()=>dropRow(active,active)}/>}
    <Banner m={m}/>
    {locked.some(Boolean)&&<Budget plan={plan} done={all} rows={CREWS.map((c,i)=>({show:locked[i],r:c.rate,c:c.cost,S:S[i],D:D[i]}))}/>}
    {all&&<div className="banner good">✓ Quest complete<span className="sp"/><button className="go" onClick={()=>{DL.set({...schedCols(CREWS.map((c,i)=>({rate:c.rate,dc:c.cost,S:S[i],E:S[i]+D[i]}))),duration:projDur(plan)});done()}}>Finish ▶</button></div>}
  </Split>);
}

/* ===== TRAINING 3 · RUN → PLOT → FIX ===== */
function M3({miss,done}){
  const [ph,setPh]=useState(0);
  const base=[{S:1,D:10},{S:1,D:12},{S:6,D:6}],STOP=11;
  const clk=useClock();const [spd,setSpd]=useState(1);const [boom,setBoom]=useState(false);
  useEffect(()=>{clk.set(1)},[]);
  const TP=targets(base),P=usePlot(TP,miss),k=P.k;
  const [bS,setBS]=useState(6);const fclk=useClock();const [running,setRunning]=useState(false);const [ran,setRan]=useState(false);
  clk.rate.current=1.2*spd;fclk.rate.current=2.4;
  const t=clk.t;
  useEffect(()=>{if(ph===0&&!boom&&t>=STOP-1e-6){setBoom(true);clk.stop();Snd.alarm()}},[t]);
  useEffect(()=>{if(ph===1&&k===6)Snd.alarm()},[k]);
  const fix=[{S:1,D:10},{S:1,D:12},{S:bS,D:6}],fc=clash(fix[1],fix[2]),clear=!fc;
  useEffect(()=>{if(running&&!fclk.run&&fclk.t>=projEnd(fix)-1e-6){setRunning(false);setRan(true);Snd.ok()}},[fclk.run,fclk.t]);
  const s0=siteRun(base,t),pf=s0.ft[1],bf=s0.ft[2],gap=t>=6?pf-bf:null;
  const {lines,pts}=plotLines(base,TP,k),q=k<6?TP[k]:null;
  let site;
  if(ph===0)site=<Site ft={s0.ft} st={s0.st} clock={'Day '+t.toFixed(1)} clash={boom?'Day 11 · 250 ft':null}
    player={{t,min:1,max:STOP,run:clk.run,disabled:boom,spd,setSpd,onPlay:()=>clk.play(t,STOP),onPause:()=>clk.stop(),onScrub:v=>{clk.stop();clk.set(v)}}}/>;
  else if(ph===1){const s=k>=6?siteRun(base,11):READY;site=<Site ft={s.ft} st={s.st} clock={k>=6?'Day 11':''}/>}
  else{const tt=running||ran?fclk.t:0,s=running||ran?siteRun(fix,tt):READY;site=<Site ft={s.ft} st={s.st} clock={running||ran?'Day '+tt.toFixed(1):''}/>}
  return(<Split site={site}>
    <div className="row l"><Pills cur={ph} items={['① Run','② Plot the LOB','③ Fix']}/></div>
    {ph===0&&<>
      <div className="board"><div className="bhd">📊 Bar chart · looks clean<Info k="bar"/><span className="sp"/><span className="chip y">▶ Press play on the 3D screen →</span></div>
        <Timeline tMax={16} rows={CREWS.map((c,i)=>({...c,placed:true,S:base[i].S,D:base[i].D,fill:(t-base[i].S)/base[i].D,st:t>=endOf(base[i])?'✓':''}))}/>
        <Stats items={[{l:'🏗️ Pipe laying',v:Math.round(pf)+' ft'},{l:'🚛 Backfill',v:t>=6?Math.round(bf)+' ft':'—'},{l:'Gap',v:gap==null?'—':Math.max(0,Math.round(gap))+' ft',k:gap!=null&&gap<=50?'warn':''}]}/></div>
      {boom&&<div className="banner bad">💥 Backfill caught Pipe laying · day 11 · 250 ft<span className="sp"/><button className="go" onClick={()=>{DL.mark('run');setPh(1)}}>② Find it on the LOB ▶</button></div>}
    </>}
    {ph===1&&<>
      <div className="board grow"><div className="bhd">📈 Line of Balance<Info k="lob"/><span className="sp"/>{q&&<span className="chip y">👆 {CREWS[q.ci].tag} {k%2?'END':'START'} · {k+1}/6</span>}</div>
        <div className="minitable">{CREWS.map((c,i)=><span key={c.k} style={{color:c.c}}>{c.ic} {c.tag}: day {base[i].S} → day {endOf(base[i])}</span>)}</div>
        <Lob tMax={16} lines={lines} points={pts} ring={q?{t:q.t,ft:q.ft}:null} attempt={P.att} hit={k>=6?{t:11,ft:250}:null} onPick={k<6?P.pick:undefined}/>
        <Legend/></div>
      {k<6&&<Banner m={P.m}/>}
      {k>=6&&<div className="banner bad">💥 Backfill crosses Pipe laying · 250 ft · day 11<span className="sp"/><button className="go" onClick={()=>{DL.mark('plot');setPh(2)}}>③ Fix it ▶</button></div>}
    </>}
    {ph===2&&<>
      <div className="board grow"><div className="bhd">📈 Drag the 🚛 Backfill line ↔<span className="sp"/><span className={'chip '+(clear?'ok':'no')}>{clear?'✓ LINES CLEAR':'⚠ LINES TOUCH'}</span><Info k="conflict"/></div>
        <Lob tMax={18} lines={fix.map((p,i)=>({...p,c:CREWS[i].c}))} hit={fc?{t:fc.t,ft:fc.ft}:null} cursor={running||ran?fclk.t:null}
          drag={running?null:{idx:[2],lim:[[1,12]],onMove:(i,v)=>{if(v!==bS){DL.inc('backfill_moves');DL.ev('move',{crew:'Backfill',start:v,clash:!!clash(fix[1],{S:v,D:6})})}setBS(v);setRan(false)}}}/>
        <Stats items={[{l:'🚛 Backfill start',v:'Day '+bS},{l:'Project',v:projDur(fix)+' days'},{l:'Crew cost',v:'$16,400'}]}/></div>
      {!clear&&<div className="banner bad">⚠ {fc.ft>=PJ-1e-6?'Same spot at 300 ft on day '+fmt(fc.t):'Lines cross at '+Math.round(fc.ft)+' ft on day '+fmt(fc.t)} — drag Backfill later</div>}
      {clear&&!ran&&<div className="banner good">✓ Backfill day {bS} → {bS+6}<span className="sp"/><button className="go" disabled={running} onClick={()=>{DL.inc('runs');DL.ev('run',{backfill_start:bS});setRunning(true);fclk.play(0,projEnd(fix))}}>▶ Run again</button></div>}
      {clear&&ran&&<div className="banner good">✓ No collision · {projDur(fix)} days<span className="sp"/><button className="go" onClick={()=>{DL.mark('fix');DL.set({...schedCols(CREWS.map((c,i)=>({rate:c.rate,dc:c.cost,S:fix[i].S,E:fix[i].S+fix[i].D}))),duration:projDur(fix),direct:16400,total:loaded(16400).total});
        DL.snap(planShot('Training 3 · Final schedule',fix,CREWS.map(c=>c.rate)));done()}}>Finish ▶</button></div>}
      <Budget title={clear?'📋 Final schedule':'📋 Final schedule · fix the clash first'} done={true} plan={fix} rows={CREWS.map((c,i)=>({r:c.rate,c:c.cost,S:fix[i].S,D:fix[i].D,show:true}))}/>
    </>}
  </Split>);
}

/* ===== TRAINING 4 · BUFFER (1 day, 5 days) ===== */
function M4({done}){
  const BUF=[1,5];const [stp,setStp]=useState(0);const [pS,setPS]=useState(1);const [bS,setBS]=useState(8);const clk=useClock();const [running,setRunning]=useState(false);const [res,setRes]=useState([]);
  clk.rate.current=4;
  const b=BUF[stp],tP=1+b,tB=2*b+7;
  const plan=[{S:1,D:10},{S:pS,D:12},{S:bS,D:6}],gs=pS-1,ge=endOf(plan[2])-endOf(plan[1]),onT=pS===tP&&bS===tB,cur=res[stp],both=res[0]&&res[1];
  useEffect(()=>{if(running&&!clk.run&&clk.t>=projEnd(plan)-1e-6){setRunning(false);const r=res.slice();r[stp]={P:pS,B:bS,end:projEnd(plan),dur:projDur(plan)};setRes(r);DL.mark('buffer'+b);DL.ev('buffer_run',{buffer_days:b,pipe_start:pS,backfill_start:bS,days:projDur(plan)});Snd.ok()}},[clk.run,clk.t]);
  const live=running||cur,tt=live?clk.t:0,s=live?siteRun(plan,tt):READY;
  const ghosts=onT||cur?[]:[{S:tP,D:12,c:CREWS[1].c,ghost:true},{S:tB,D:6,c:CREWS[2].c,ghost:true}];
  return(<Split compact={both} site={<Site ft={s.ft} st={s.st} clock={live?'Day '+tt.toFixed(1):''}/>}>
    {!both&&<div className="guide define"><p><b>🛡 Buffer</b> = a planned gap in time between a crew and the crew it follows. <b>Why it matters:</b> real work is never perfectly on time — rain, a breakdown, a late delivery. A buffer lets the follower absorb a delay without running into the crew ahead.</p></div>}
    <div className="row l"><Pills cur={both?2:stp} items={['1-day buffer','5-day buffer']}/>{!both&&!cur&&<span className="chip y">👉 Pipe laying → day {tP} · Backfill → day {tB}</span>}</div>
    <div className="board grow">
      <div className="bhd">📈 {both?'Line of Balance · 5-day buffer':'Drag 🏗️ Pipe laying and 🚛 Backfill onto the dashed lines · '+b+'-day gaps'}<Info k="buffer"/></div>
      <Lob tMax={26} lines={[...plan.map((p,i)=>({...p,c:CREWS[i].c})),...ghosts]} cursor={live?clk.t:null}
        drag={live||both?null:{idx:[1,2],lim:[[1,12],[1,20]],onMove:(i,v)=>{if(v!==(i===1?pS:bS))DL.inc('line_moves');if(i===1)setPS(v);else setBS(v)}}}/>
      <Stats items={[{l:'Start gap',v:gs+' d',k:gs===b?'good':''},{l:'End gap',v:ge+' d',k:ge===b?'good':''},{l:'Days',v:projDur(plan)}]}/>
      <div className="gapnote"><span><b>Start gap</b> = Pipe laying start − Excavation start</span><span><b>End gap</b> = Backfill finish − Pipe laying finish</span></div>

/* day-by-day engine: every day each crew moves rate × factors; its last day only finishes the feet left

function r2sim(P,evs,picks,borrows,extra,pauses){pauses=pauses||[];
  const S=P.S.map((s,i)=>s+extra[i]),r=P.rate,x=[0,0,0],F=[null,null,null],tr=[[],[],[]],wait=[0,0,0],te={},conf=[null,null,null],segs=[[],[],[]];
  let mods=pauses.map(p=>[p.c,p.a,p.a+p.n,0,'⏸ Paused']),adds=[],fees=0;
  for(let i=0;i<3;i++)tr[i].push({t:S[i],x:0,w:false});
  for(let day=Math.min(...S);day<80&&F.some(f=>f===null);day++){
    for(const e of evs)if(te[e]==null&&x[R2EV[e].crew]>=R2EV[e].at-1e-9){te[e]=day;if(picks[e]!=null){const f=r2effect(e,picks[e],borrows[e],day);mods=mods.concat(f.mods);adds=adds.concat(f.adds);fees+=f.fees}}
    const x0=x.slice();
    for(let i=0;i<3;i++){if(F[i]!==null||day<S[i])continue;
      let m=1,add=0;const labs=[];
      for(const [c,a,b,k,l] of mods)if(c===i&&day>=a&&day<b){m*=k;if(l&&!labs.includes(l))labs.push(l)}
      for(const [c,a,b,k,l] of adds)if(c===i&&day>=a&&day<b){add+=k;if(l&&!labs.includes(l))labs.push(l)}
      if(labs.includes('⏸ Paused')){m=0;add=0;labs.splice(0,labs.length,'⏸ Paused')}
      const v=Math.max(0,r[i]*m+add),adv=Math.min(v,PJ-x[i]);
      if(v<=1e-9)wait[i]++;
      x[i]+=adv;const tEnd=x[i]>=PJ-1e-9&&v>0?day+adv/v:day+1;
      tr[i].push({t:tEnd,x:x[i],w:false});
      const lab=labs.length?labs.join(' · '):'Working',sg=segs[i][segs[i].length-1];
      if(sg&&sg.lab===lab&&Math.abs(sg.rate-v)<1e-9&&sg.b===day){sg.b=day+1;sg.ft+=adv}else segs[i].push({lab,rate:v,a:day,b:day+1,ft:adv,red:lab!=='Working'});
      if(x[i]>=PJ-1e-9)F[i]=tEnd}
    for(let i=1;i<3;i++){if(conf[i]||day<S[i])continue;const L=i-1;
      if(F[L]!==null&&F[L]<=day+1e-9)continue;
      const f0=x0[i],f1=x[i],l0=x0[L],l1=x[L];
      const fT=F[i]!==null&&F[i]<=day+1+1e-9?F[i]:null,lT=F[L]!==null&&F[L]<=day+1+1e-9?F[L]:null;
      if(fT!==null&&(lT===null||fT<=lT+1e-9)){conf[i]={i,t:fT,ft:PJ};continue}
      if(f1>1e-9&&lT===null&&f1>=l1-1e-9){const den=(f1-f0)-(l1-l0);const u=f0<l0-1e-9&&den>1e-9?Math.min(1,(l0-f0)/den):0;conf[i]={i,t:day+u,ft:f0+u*(f1-f0)}}}
  }
  const E=F.map(f=>Math.ceil(f-1e-9)),paid=E.map((e,i)=>e-S[i]),direct=paid.reduce((a,p,i)=>a+p*P.cost[i],0),b=loaded(direct);
  const dur=Math.max(...E)-Math.min(...S),late=P.deadline!=null?Math.max(0,dur-P.deadline):0,ld=late*R2LD;
  return{S,E,F,paid,wait,tr,te,segs,fees,direct,b,dur,late,ld,total:b.total+fees+ld,conflicts:conf.filter(Boolean)}}
function posAt(tr,t){if(t<=tr[0].t)return{x:0,w:false};for(let k=1;k<tr.length;k++){if(tr[k].t>=t){const a=tr[k-1],b=tr[k],f=(t-a.t)/Math.max(1e-9,b.t-a.t);return{x:a.x+(b.x-a.x)*f,w:b.w}}}return{x:PJ,w:false}}
function r2site(res,t){const ft=[],st=[];for(let i=0;i<3;i++){const p=posAt(res.tr[i],t),q=posAt(res.tr[i],t+.06);ft.push(p.x);
  st.push(t<res.S[i]?'ready':p.x>=PJ-1e-6?'done':(q.x-p.x)<.05?'ready':'work')}return{ft,st}}
function r2log(rec){try{const K='pipelineRush.s2log',a=JSON.parse(localStorage.getItem(K)||'[]');a.push({...rec,at:Date.now()});localStorage.setItem(K,JSON.stringify(a.slice(-400)))}catch(e){}
  (window.__s2log=window.__s2log||[]).push(rec)}
const r2stars=left=>left<0?0:left>=2000?3:left>=1000?2:1;
const fleetTxt=q=>q.map((n,j)=>n?n+' '+SZ[j]:null).filter(Boolean).join(' + ')||'none';
function r2todate(P,res,t,feeLog){
  const days=CREWS.map((c,i)=>t<=res.S[i]?0:Math.min(t,res.E[i])-res.S[i]);
  const wait=CREWS.map((c,i)=>{let w=0;const tr=res.tr[i];for(let k=1;k<tr.length;k++)if(tr[k].t<=t&&tr[k].x<PJ-1e-6&&tr[k].x-tr[k-1].x<1e-6)w+=tr[k].t-tr[k-1].t;return w});
  const fees=feeLog.filter(f=>f.t<=t+1e-9).reduce((a,f)=>a+f.fee,0);
  const crew=days.reduce((a,d,i)=>a+d*P.cost[i],0),b=loaded(Math.round(crew));
  return{days,wait,fees,crew,b,total:b.total+fees}}

        <td className={'r'+(res.paid[i]>plan[i]?' bad':res.paid[i]<plan[i]?' good':'')}>{res.paid[i]} d</td><td className={'r'+(res.wait[i]>.05?' bad':'')}>{res.wait[i]>.05?res.wait[i].toFixed(1)+' d':'—'}</td>
        <td className="r">{money(res.paid[i]*P.cost[i])}</td></tr>)}
      <tr className="tot"><td colSpan="5">Crew cost (direct)</td><td className="r">{money(res.b.direct)}</td></tr>
      <tr><td colSpan="5">Indirect (30%) + Profit (5%)</td><td className="r">{money(res.b.ind+res.b.pr)}</td></tr>

function Debrief({P,res,picks,borrows,budget,pauses}){
  const items=[];
  (pauses||[]).forEach(p=>items.push({ic:'⏸',t:'You paused '+CREWS[p.c].tag+' for '+p.n+' day'+(p.n>1?'s':'')+' from Day '+p.a.toFixed(1)+', still paid',bad:true}));
  Object.keys(picks).forEach(e=>{const E=R2EV[e],o=E.opts[picks[e]],m=borrows[e];
    items.push({ic:E.ic,t:E.name+' → you chose '+o.k+' · '+o.n+(m&&m.j!=null?' ('+SZ[m.j]+(o.type==='borrow'?' from '+CREWS[m.L].tag:'')+')':'')});
    if(E.id==='P1'&&o.type!=='reset')items.push({ic:'⏸',t:'Pipe laying stopped '+r2len(+e,picks[e],m)+' day'+(r2len(+e,picks[e],m)>1?'s':'')+' while the trench was made safe, still paid',bad:true});
    if(o.type==='borrow'){const L=m.L,lose=rateOf(L,m.j),wasDone=res.F[L]!=null&&res.te[e]!=null&&res.te[e]>=res.F[L]-1e-6;
      items.push({ic:'🔁',t:wasDone?CREWS[L].tag+' had already finished, so lending its idle machine cost nothing':CREWS[L].tag+' worked at '+Math.max(0,P.rate[L]-lose)+' ft/d instead of '+P.rate[L]+' while its '+SZ[m.j]+' was away, still paying for it'})}});
  CREWS.forEach((c,i)=>{const dd=res.paid[i]-P.base.paid[i];
    if(res.S[i]>P.S[i])items.push({ic:'⏩',t:'You delayed '+c.tag+' to start Day '+res.S[i]+' instead of Day '+P.S[i]});
    if(dd>0)items.push({ic:'💸',t:c.tag+': '+res.paid[i]+' paid days instead of '+P.base.paid[i]+' → +'+money(dd*P.cost[i])+' crew cost',bad:true});
    if(dd<0)items.push({ic:'✅',t:c.tag+': '+res.paid[i]+' paid days instead of '+P.base.paid[i]+' → '+money(dd*P.cost[i])});});
  if(res.fees)items.push({ic:'🧾',t:'Response fees: '+money(res.fees)});
  if(res.late)items.push({ic:'⏰',t:'Finished Day '+Math.max(...res.E)+': '+res.late+' day'+(res.late>1?'s':'')+' past the deadline → late fee '+money(res.ld),bad:true});
  else items.push({ic:'⏰',t:'Finished Day '+Math.max(...res.E)+', on time'});
  const left=budget-res.total;
  items.push({ic:left<0?'✗':'✓',t:'Total '+money(res.total)+' vs budget '+money(budget)+' → '+(left<0?money(-left)+' over':money(left)+' left'),bad:left<0,strong:true});
  return(<div className="debrief"><h4>🔎 What happened</h4><ul>{items.map((x,i)=><li key={i} className={(x.bad?'bad':'')+(x.strong?' strong':'')}><span>{x.ic}</span>{x.t}</li>)}</ul></div>);
}

function R21(p){return <RiskLevel {...p} evs={[0]} lvl="2.1"/>}
function R22(p){return <RiskLevel {...p} evs={[1]} lvl="2.2"/>}
function R23(p){return <RiskLevel {...p} evs={[2]} lvl="2.3"/>}

const COMPS=[M1,M2,M3,M4,M5,M6,R21,R22,R23,R24];

/* ===== SCREENS ===== */
function Level({i,onDone}){
  const [m,setM]=useState(0);const [intro,setIntro]=useState(true);const mRef=useRef(0);mRef.current=m;
  const miss=useCallback(()=>{setM(x=>x+1);DL.inc('mistakes');DL.ev('mistake');Snd.bad()},[]);
  useState(()=>{DL.begin(i);return 1});   /* start the attempt before child effects run */

  const done=useCallback(st=>{const s2=typeof st==='number'?st:null;if(DL.cur&&DL.cur.i===i)DL.end('complete',{stars:s2!=null?Math.max(1,s2):Math.max(1,3-mRef.current)});onDone(i,mRef.current,s2)},[i,onDone]);
  const S=STEPS[i],C=COMPS[i],hats=3-Math.min(m,2);
  return(<main className="wrap wide level">
    <div className="lbar"><span className="lname">{S.stage===2?'Stage 2 · '+S.n:'Training '+S.n} · {S.name}</span>{S.stage!==2&&<span className="chip" aria-label={hats+' hard hats'}>{'⛑️'.repeat(hats)}{'·'.repeat(3-hats)}</span>}</div>
    <StepCtx.Provider value={S}><C miss={miss} done={done}/></StepCtx.Provider>
    {intro&&<div className="ov"><div className="panel"><div className="lv">{S.stage===2?'STAGE 2 · EVENT '+S.n:'TRAINING '+S.n}</div><h3>{S.name}</h3>
      <div className="guide mission" style={{textAlign:'left'}}><h4>🎯 Your mission</h4><p>{S.mission}</p></div>
      <div className="guide learn" style={{textAlign:'left'}}><h4>🎓 What you will learn</h4><p>{S.learn}</p></div>
      <div className="row"><button className="go" autoFocus onClick={()=>{DL.mark('intro');setIntro(false)}}>▶ Play</button></div></div></div>}
  </main>);
}
function Result({r,onNext,onMap,onReplay}){
  const S=STEPS[r.i];
  return(<div className="ov"><div className="panel"><div className="lv">{S.stage===2?'EVENT '+S.n+' CLEAR':'TRAINING '+S.n+' CLEAR'}</div><h3>{S.name}</h3>
    <div className="bigstars">{[0,1,2].map(j=><span key={j} className={j<r.stars?'':'off'}>★</span>)}</div>
    <div className="guide why" style={{textAlign:'left'}}><h4>✅ What you learned</h4><p><b>{S.ins}</b></p><p>{S.learned}</p></div>
    <div className="row"><button className="go ghost" onClick={onReplay}>↺ Replay</button><button className="go ghost" onClick={onMap}>🗺 Map</button><button className="go" onClick={onNext}>{r.i<NM-1?'Next ▶':'🏁 Done'}</button></div>
  </div></div>);
}
const MAPSTAGES=[{tag:'Stage 1',ttl:'Plan the work',ids:[0,1,2,3,4,5]},{tag:'Stage 2',ttl:'When the site bites',ids:[6,7,8,9]}];

      <button key={i} className={'node '+st} disabled={st==='locked'} onClick={()=>onPlay(i)}>

        <span className="stars">{[0,1,2].map(j=><span key={j} className={j<prog.stars[i]?'':'off'}>★</span>)}</span></button>)})}</div>
  </div>)}</main>);
}
function Help({onClose}){return(<div className="ov"><div className="panel"><h3>How to play</h3>
  <div className="steps3"><div><span className="ico">🎯</span>Read your mission</div><div><span className="ico">🖐</span>Drag, plot, run</div><div><span className="ico">🎓</span>Learn why it works</div></div>

  const onDone=useCallback((i,mistakes,st)=>{const stars=st!=null?Math.max(1,st):Math.max(1,3-mistakes),p=progRef.current;
    const n={...p,stars:p.stars.slice()};n.stars[i]=Math.max(p.stars[i],stars);progRef.current=n;setProg(n);setResult({i,stars});Snd.star();confetti()},[]);
  const play=i=>{setLvl(i);setRun(r=>r+1);setResult(null);setScreen('level')};

      <button className="ibtn" onClick={()=>setHelp(true)} aria-label="How to play">?</button>
      <button className="ibtn" onClick={toMap}>🗺 Map</button></div><div className="hazard"/></header>
    {screen==='map'&&<MapScreen prog={prog} onPlay={play}/>}

    {result&&<Result r={result} onReplay={()=>play(result.i)} onMap={toMap} onNext={()=>{if(result.i<NM-1)play(result.i+1);else toMap()}}/>}
    {help&&!askId&&<Help onClose={()=>{setHelp(false);setProg(p=>({...p,seenHelp:true}))}}/>}
    {askId&&<PidAsk cur={pid} onSave={code=>{const changed=code!==pid;DL.setPid(code);setPid(code);setAskId(false);

    <Ghost/>
